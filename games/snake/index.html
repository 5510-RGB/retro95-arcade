<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNAKE 1997 - Nokia 6110 / 3310 LCD Edition</title>
  <style>
    :root {
      --lcd-bg: #9bbc0f;
      --lcd-light: #8bac0f;
      --lcd-mid: #306230;
      --lcd-dark: #0f380f;
      --body-bg: #1b222c;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--body-bg);
      font-family: "Courier New", Courier, monospace;
      color: var(--lcd-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .phone-frame {
      background: linear-gradient(145deg, #2d3748, #1a202c);
      border: 6px solid #4a5568;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .nokia-brand {
      color: #cbd5e0;
      font-weight: bold;
      letter-spacing: 5px;
      font-size: 0.9rem;
    }

    .lcd-screen {
      background-color: var(--lcd-bg);
      border: 4px solid var(--lcd-dark);
      padding: 10px;
      box-shadow: inset 0 0 12px rgba(15, 56, 15, 0.35);
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .lcd-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid var(--lcd-dark);
      padding-bottom: 4px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    canvas {
      display: block;
      background-color: var(--lcd-bg);
      border: 2px solid var(--lcd-dark);
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 520px) {
      .phone-frame { padding: 10px; border-width: 3px; width: 96vw; }
    }

    .controls-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: space-between;
    }

    .nokia-btn {
      flex: 1;
      background: #4a5568;
      color: #fff;
      border: 2px solid #718096;
      border-radius: 12px;
      padding: 8px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.1s;
    }

    .nokia-btn:hover {
      background: #718096;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      background: rgba(155, 188, 15, 0.94);
      border: 2px solid var(--lcd-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }

    .hidden {
      display: none !important;
    }

    .lcd-btn {
      background: var(--lcd-dark);
      color: var(--lcd-bg);
      border: none;
      padding: 8px 16px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="nokia-brand">NOKIA // 1997</div>

    <div class="lcd-screen">
      <div class="lcd-header">
        <span>SKOR: <span id="score">0000</span></span>
        <span>HIZ: <span id="speed-lvl">1</span></span>
        <span>REKOR: <span id="best">0000</span></span>
      </div>

      <canvas id="board" width="420" height="360"></canvas>

      <div id="overlay" class="overlay">
        <h2 id="ov-title" style="margin: 0 0 6px 0;">SNAKE II</h2>
        <p id="ov-desc" style="margin: 0; font-size: 0.85rem;">Yemleri topla, kuyruğuna ve duvarlara çarpma!</p>
        <button class="lcd-btn" id="start-btn">BAŞLAT [ENTER]</button>
      </div>
    </div>

    <div class="controls-bar">
      <button class="nokia-btn" id="wall-btn">DUVAR: AÇIK</button>
      <button class="nokia-btn" id="sound-btn">SES: AÇIK</button>
      <button class="nokia-btn" id="pause-btn">DURAKLAT [P]</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const CELL = 20;
    const COLS = canvas.width / CELL;  // 21
    const ROWS = canvas.height / CELL; // 18

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 10, y: 10 };
    let bonusFood = null;
    let bonusTimer = 0;

    let score = 0;
    let bestScore = 0;
    let speedLevel = 1;
    let wrapWalls = false;
    let soundEnabled = true;
    let isGameOver = true;
    let isPaused = false;
    let stepInterval = 130;
    let lastTime = 0;
    let accTime = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function beep(freq, dur, type = "square", vol = 0.04) {
      if (!soundEnabled) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur / 1000);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur / 1000);
    }

    function reportScore() {
      if (score > bestScore) bestScore = score;
      document.getElementById("best").innerText = String(bestScore).padStart(4, "0");
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "RETRO_HIGH_SCORE", gameId: "snake-1997", score: score }, "*");
      }
    }

    function spawnFood() {
      while (true) {
        const fx = (Math.random() * COLS) | 0;
        const fy = (Math.random() * ROWS) | 0;
        const onSnake = snake.some(s => s.x === fx && s.y === fy);
        if (!onSnake) {
          food = { x: fx, y: fy };
          break;
        }
      }
    }

    function spawnBonus() {
      for (let i = 0; i < 30; i++) {
        const bx = (Math.random() * COLS) | 0;
        const by = (Math.random() * ROWS) | 0;
        const onSnake = snake.some(s => s.x === bx && s.y === by);
        if (!onSnake && (bx !== food.x || by !== food.y)) {
          bonusFood = { x: bx, y: by };
          bonusTimer = 45; // 45 adım boyunca kalır
          return;
        }
      }
    }

    function startGame() {
      snake = [
        { x: 6, y: 9 },
        { x: 5, y: 9 },
        { x: 4, y: 9 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speedLevel = 1;
      stepInterval = 130;
      bonusFood = null;
      isGameOver = false;
      isPaused = false;
      spawnFood();
      updateUI();
      document.getElementById("overlay").classList.add("hidden");
      beep(660, 80);
      lastTime = performance.now();
      accTime = 0;
      requestAnimationFrame(loop);
    }

    function updateUI() {
      document.getElementById("score").innerText = String(score).padStart(4, "0");
      document.getElementById("speed-lvl").innerText = speedLevel;
    }

    function step() {
      dir = { ...nextDir };
      let headX = snake[0].x + dir.x;
      let headY = snake[0].y + dir.y;

      if (wrapWalls) {
        headX = (headX + COLS) % COLS;
        headY = (headY + ROWS) % ROWS;
      } else {
        if (headX < 0 || headX >= COLS || headY < 0 || headY >= ROWS) {
          return gameOver();
        }
      }

      if (snake.some(seg => seg.x === headX && seg.y === headY)) {
        return gameOver();
      }

      snake.unshift({ x: headX, y: headY });

      if (headX === food.x && headY === food.y) {
        score += 10 * speedLevel;
        beep(880, 60);
        setTimeout(() => beep(1174, 80), 50);
        if (snake.length % 5 === 0) {
          speedLevel = Math.min(9, speedLevel + 1);
          stepInterval = Math.max(55, 130 - (speedLevel - 1) * 9);
          if (!bonusFood) spawnBonus();
        }
        spawnFood();
        updateUI();
        reportScore();
      } else if (bonusFood && headX === bonusFood.x && headY === bonusFood.y) {
        score += 50 * speedLevel;
        bonusFood = null;
        beep(1046, 70);
        setTimeout(() => beep(1318, 120), 60);
        updateUI();
        reportScore();
      } else {
        snake.pop();
      }

      if (bonusFood) {
        bonusTimer--;
        if (bonusTimer <= 0) bonusFood = null;
      }
    }

    function gameOver() {
      isGameOver = true;
      beep(220, 200, "sawtooth", 0.06);
      setTimeout(() => beep(140, 350, "sawtooth", 0.06), 180);
      reportScore();
      document.getElementById("ov-title").innerText = "OYUN BİTTİ";
      document.getElementById("ov-desc").innerText = `Skorun: ${score}`;
      document.getElementById("start-btn").innerText = "TEKRAR OYNA [ENTER]";
      document.getElementById("overlay").classList.remove("hidden");
    }

    function drawLCDPixel(x, y, inset = 2) {
      ctx.fillStyle = "#0f380f";
      ctx.fillRect(x * CELL + inset, y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
    }

    function draw() {
      ctx.fillStyle = "#9bbc0f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Hafif LCD piksel matrisi
      ctx.fillStyle = "rgba(15, 56, 15, 0.08)";
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
        }
      }

      // Yem (Nokia 4 noktalı elma ikonu)
      const fx = food.x * CELL;
      const fy = food.y * CELL;
      ctx.fillStyle = "#0f380f";
      ctx.fillRect(fx + 7, fy + 2, 6, 5);
      ctx.fillRect(fx + 2, fy + 7, 5, 6);
      ctx.fillRect(fx + 13, fy + 7, 5, 6);
      ctx.fillRect(fx + 7, fy + 13, 6, 5);

      // Bonus yem (Kurbağa / Böcek)
      if (bonusFood) {
        ctx.fillStyle = "#0f380f";
        ctx.strokeStyle = "#0f380f";
        ctx.lineWidth = 2;
        ctx.strokeRect(bonusFood.x * CELL + 2, bonusFood.y * CELL + 2, CELL - 4, CELL - 4);
        ctx.fillRect(bonusFood.x * CELL + 6, bonusFood.y * CELL + 6, CELL - 12, CELL - 12);
      }

      // Yılan
      snake.forEach((seg, idx) => {
        if (idx === 0) {
          drawLCDPixel(seg.x, seg.y, 1);
          ctx.fillStyle = "#9bbc0f";
          ctx.fillRect(seg.x * CELL + 5, seg.y * CELL + 5, 3, 3);
          ctx.fillRect(seg.x * CELL + 12, seg.y * CELL + 5, 3, 3);
        } else {
          drawLCDPixel(seg.x, seg.y, 2);
        }
      });
    }

    function loop(time) {
      if (isGameOver || isPaused) return;
      const dt = time - lastTime;
      lastTime = time;
      accTime += dt;
      if (accTime >= stepInterval) {
        accTime = 0;
        step();
      }
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", e => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
        e.preventDefault();
      }
      if (e.key === "Enter" && isGameOver) {
        startGame();
        return;
      }
      if (e.key === "p" || e.key === "P") {
        togglePause();
        return;
      }
      if (isGameOver || isPaused) return;

      if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W") && dir.y === 0) {
        nextDir = { x: 0, y: -1 };
      } else if ((e.key === "ArrowDown" || e.key === "s" || e.key === "S") && dir.y === 0) {
        nextDir = { x: 0, y: 1 };
      } else if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && dir.x === 0) {
        nextDir = { x: -1, y: 0 };
      } else if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && dir.x === 0) {
        nextDir = { x: 1, y: 0 };
      }
    });

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        document.getElementById("ov-title").innerText = "DURAKLATILDI";
        document.getElementById("ov-desc").innerText = "Devam etmek için P tuşuna bas";
        document.getElementById("start-btn").innerText = "DEVAM ET";
        document.getElementById("overlay").classList.remove("hidden");
      } else {
        document.getElementById("overlay").classList.add("hidden");
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }
    }

    document.getElementById("start-btn").addEventListener("click", () => {
      if (isPaused) togglePause();
      else startGame();
    });

    document.getElementById("pause-btn").addEventListener("click", togglePause);

    document.getElementById("wall-btn").addEventListener("click", () => {
      wrapWalls = !wrapWalls;
      document.getElementById("wall-btn").innerText = wrapWalls ? "DUVAR: GEÇİŞLİ" : "DUVAR: AÇIK";
    });

    document.getElementById("sound-btn").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-btn").innerText = soundEnabled ? "SES: AÇIK" : "SES: KAPALI";
    });

    draw();
  </script>
</body>
</html>
