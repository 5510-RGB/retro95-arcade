<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PONG 1972 - Atari Arcade Classic</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #080808;
      color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 6px;
    }

    .cabinet {
      position: relative;
      border: 3px solid #ffffff;
      padding: 12px;
      background: #000;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
    }

    canvas {
      display: block;
      background: #000;
      border: 1px solid #444;
      max-width: 100%;
      height: auto;
    }
    .cabinet { max-width: 96vw; }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      justify-content: space-between;
    }

    .btn {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    .overlay {
      position: absolute;
      inset: 12px;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>ATARI // PONG (1972)</h1>
    <div style="font-size: 0.78rem; opacity: 0.75; margin-top: 3px;">11 PUANA ULAŞAN KAZANIR • RALLİ SKORU REKORA YAZILIR</div>
  </div>

  <div class="cabinet">
    <canvas id="court" width="640" height="420"></canvas>

    <div id="overlay" class="overlay">
      <h2 id="ov-title" style="margin: 0 0 8px 0; letter-spacing: 3px;">JETON ATIN</h2>
      <p id="ov-desc" style="font-size: 0.85rem; max-width: 380px; line-height: 1.5;">
        Yukarı / Aşağı Ok tuşları veya W / S ile raketini kontrol et.
      </p>
      <button class="btn" id="start-btn" style="font-weight: bold; margin-top: 8px; padding: 10px 20px;">
        MAÇI BAŞLAT [ENTER]
      </button>
    </div>

    <div class="toolbar">
      <button class="btn" id="mode-btn">MOD: 1 OYUNCU (CPU)</button>
      <button class="btn" id="sound-btn">SES: AÇIK</button>
      <div style="align-self: center; font-size: 0.82rem;">PUAN SKORU: <strong id="total-pts">0</strong></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("court");
    const ctx = canvas.getContext("2d");

    const PADDLE_W = 12;
    const PADDLE_H = 74;
    const WIN_SCORE = 11;

    let twoPlayer = false;
    let soundEnabled = true;
    let isGameOver = true;
    let totalRallyPoints = 0;

    const p1 = { x: 20, y: canvas.height / 2 - PADDLE_H / 2, score: 0, dy: 0 };
    const p2 = { x: canvas.width - 20 - PADDLE_W, y: canvas.height / 2 - PADDLE_H / 2, score: 0, dy: 0 };
    const ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 5, vy: 3, size: 10, speed: 5.5 };

    const keys = {};
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, dur) {
      if (!soundEnabled) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur / 1000);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur / 1000);
    }

    function reportScore() {
      document.getElementById("total-pts").innerText = totalRallyPoints;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "RETRO_HIGH_SCORE", gameId: "pong-1972", score: totalRallyPoints }, "*");
      }
    }

    function resetBall(dir = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 5.5;
      const angle = (Math.random() * 0.8 - 0.4);
      ball.vx = dir * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    function startGame() {
      p1.score = 0;
      p2.score = 0;
      totalRallyPoints = 0;
      reportScore();
      p1.y = canvas.height / 2 - PADDLE_H / 2;
      p2.y = canvas.height / 2 - PADDLE_H / 2;
      resetBall(1);
      isGameOver = false;
      document.getElementById("overlay").classList.add("hidden");
      requestAnimationFrame(loop);
    }

    function update() {
      // Oyuncu 1 (Sol raket)
      const speed = 6.5;
      if (keys["KeyW"] || (!twoPlayer && keys["ArrowUp"])) p1.y -= speed;
      if (keys["KeyS"] || (!twoPlayer && keys["ArrowDown"])) p1.y += speed;
      p1.y = Math.max(10, Math.min(canvas.height - PADDLE_H - 10, p1.y));

      // Oyuncu 2 veya CPU (Sağ raket)
      if (twoPlayer) {
        if (keys["ArrowUp"]) p2.y -= speed;
        if (keys["ArrowDown"]) p2.y += speed;
      } else {
        const target = ball.y - PADDLE_H / 2;
        const diff = target - p2.y;
        p2.y += Math.sign(diff) * Math.min(Math.abs(diff), 4.7);
      }
      p2.y = Math.max(10, Math.min(canvas.height - PADDLE_H - 10, p2.y));

      // Top Hareketi
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Üst/Alt duvar sekmesi
      if (ball.y <= 10 || ball.y + ball.size >= canvas.height - 10) {
        ball.vy = -ball.vy;
        ball.y = ball.y <= 10 ? 10 : canvas.height - 10 - ball.size;
        playBeep(290, 45);
      }

      // Sol raket çarpışması
      if (
        ball.vx < 0 &&
        ball.x <= p1.x + PADDLE_W &&
        ball.x + ball.size >= p1.x &&
        ball.y + ball.size >= p1.y &&
        ball.y <= p1.y + PADDLE_H
      ) {
        const hitPos = (ball.y + ball.size / 2 - (p1.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.speed = Math.min(11, ball.speed + 0.35);
        ball.vx = Math.abs(ball.speed * Math.cos(hitPos * 0.9));
        ball.vy = ball.speed * Math.sin(hitPos * 0.9);
        totalRallyPoints += 25;
        reportScore();
        playBeep(520, 50);
      }

      // Sağ raket çarpışması
      if (
        ball.vx > 0 &&
        ball.x + ball.size >= p2.x &&
        ball.x <= p2.x + PADDLE_W &&
        ball.y + ball.size >= p2.y &&
        ball.y <= p2.y + PADDLE_H
      ) {
        const hitPos = (ball.y + ball.size / 2 - (p2.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.speed = Math.min(11, ball.speed + 0.35);
        ball.vx = -Math.abs(ball.speed * Math.cos(hitPos * 0.9));
        ball.vy = ball.speed * Math.sin(hitPos * 0.9);
        playBeep(480, 50);
      }

      // Sayı kontrolü
      if (ball.x < 0) {
        p2.score++;
        playBeep(160, 220);
        checkWinner(-1);
      } else if (ball.x > canvas.width) {
        p1.score++;
        totalRallyPoints += 150;
        reportScore();
        playBeep(680, 180);
        checkWinner(1);
      }
    }

    function checkWinner(nextDir) {
      if (p1.score >= WIN_SCORE || p2.score >= WIN_SCORE) {
        isGameOver = true;
        if (p1.score > p2.score) {
          totalRallyPoints += (WIN_SCORE - p2.score) * 100;
          reportScore();
        }
        const winnerText = p1.score >= WIN_SCORE ? "1. OYUNCU KAZANDI!" : (twoPlayer ? "2. OYUNCU KAZANDI!" : "BİLGİSAYAR KAZANDI!");
        document.getElementById("ov-title").innerText = winnerText;
        document.getElementById("ov-desc").innerText = `Maç Skoru: ${p1.score} - ${p2.score} | Toplam Arcade Puanı: ${totalRallyPoints}`;
        document.getElementById("start-btn").innerText = "TEKRAR OYNA [ENTER]";
        document.getElementById("overlay").classList.remove("hidden");
      } else {
        resetBall(nextDir);
      }
    }

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Orta kesikli file çizgisi
      ctx.fillStyle = "#fff";
      for (let y = 12; y < canvas.height; y += 24) {
        ctx.fillRect(canvas.width / 2 - 2, y, 4, 14);
      }

      // Skor Tabelası
      ctx.font = 'bold 46px "Courier New", monospace';
      ctx.textAlign = "center";
      ctx.fillText(p1.score, canvas.width / 2 - 90, 60);
      ctx.fillText(p2.score, canvas.width / 2 + 90, 60);

      // Raketler ve Top
      ctx.fillRect(p1.x, p1.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(p2.x, p2.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
    }

    function loop() {
      if (isGameOver) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", e => {
      if (["ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
      if (e.key === "Enter" && isGameOver) startGame();
    });

    document.addEventListener("keyup", e => {
      keys[e.code] = false;
    });

    document.getElementById("start-btn").addEventListener("click", startGame);

    document.getElementById("mode-btn").addEventListener("click", () => {
      twoPlayer = !twoPlayer;
      document.getElementById("mode-btn").innerText = twoPlayer ? "MOD: 2 OYUNCU (W/S & OKLAR)" : "MOD: 1 OYUNCU (CPU)";
    });

    document.getElementById("sound-btn").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-btn").innerText = soundEnabled ? "SES: AÇIK" : "SES: KAPALI";
    });

    draw();
  </script>
</body>
</html>
