<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROAD FIGHTER 1984 - Konami Arcade / NES</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0b0e14;
      color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .arcade-frame {
      border: 3px solid #ff3333;
      background: #000;
      padding: 12px;
      box-shadow: 0 0 25px rgba(255, 51, 51, 0.25);
      position: relative;
      max-width: 96vw;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      border-bottom: 2px solid #333;
      padding-bottom: 6px;
    }

    .fuel-bar-wrap {
      display: inline-block;
      width: 90px;
      height: 12px;
      background: #222;
      border: 1px solid #fff;
      vertical-align: middle;
    }

    .fuel-bar-fill {
      height: 100%;
      background: #00ff44;
      width: 100%;
      transition: width 0.1s;
    }

    canvas {
      display: block;
      background: #1d6b22;
      border: 2px solid #444;
      max-width: 100%;
      height: auto;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.78rem;
    }

    .btn {
      background: #111;
      color: #ff4444;
      border: 1px solid #ff4444;
      padding: 6px 12px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn:hover {
      background: #ff4444;
      color: #000;
    }

    .overlay {
      position: absolute;
      inset: 12px;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="arcade-frame">
    <div class="hud">
      <span>SKOR: <span id="score" style="color:#ffcc00;">00000</span></span>
      <span>HIZ: <span id="speed" style="color:#00f0ff;">0</span> km/h</span>
      <span>
        YAKIT:
        <span class="fuel-bar-wrap"><div id="fuel-bar" class="fuel-bar-fill"></div></span>
      </span>
    </div>

    <canvas id="road" width="440" height="480"></canvas>

    <div id="overlay" class="overlay">
      <h2 id="ov-title" style="margin: 0 0 8px 0; color: #ff3333; letter-spacing: 3px;">ROAD FIGHTER // 1984</h2>
      <p id="ov-desc" style="font-size: 0.85rem; max-width: 340px; line-height: 1.5;">
        ← → ile şerit değiştir, ↑ veya SPACE ile tam gaz ver! Renkli FUEL araçlarını toplayarak benzini doldur, yağ birikintilerine ve kamyonlara dikkat et!
      </p>
      <button class="btn" id="start-btn" style="margin-top: 10px; padding: 10px 18px;">
        MOTORU ÇALIŞTIR [ENTER]
      </button>
    </div>

    <div class="footer-bar">
      <span>← → : Direksiyon | ↑ / SPACE : Turbo Gaz</span>
      <button class="btn" id="sound-btn">SES: AÇIK</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("road");
    const ctx = canvas.getContext("2d");

    const ROAD_LEFT = 80;
    const ROAD_RIGHT = 360;
    const ROAD_W = ROAD_RIGHT - ROAD_LEFT;

    let score = 0;
    let fuel = 100;
    let speed = 0;
    let maxSpeed = 320;
    let roadOffset = 0;
    let isGameOver = true;
    let soundEnabled = true;

    const player = {
      x: 205,
      y: 380,
      w: 30,
      h: 52,
      spinTimer: 0
    };

    let enemies = [];
    let pickups = [];
    let oils = [];
    let trees = [];
    let spawnTimer = 0;
    let fuelTick = 0;
    const keys = {};

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function sfx(freq, dur, type = "sawtooth", vol = 0.035) {
      if (!soundEnabled) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur / 1000);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur / 1000);
    }

    function reportScore() {
      document.getElementById("score").innerText = String(Math.floor(score)).padStart(5, "0");
      document.getElementById("speed").innerText = Math.floor(speed);
      const fb = document.getElementById("fuel-bar");
      fb.style.width = `${Math.max(0, Math.min(100, fuel))}%`;
      fb.style.backgroundColor = fuel > 30 ? "#00ff44" : "#ff3300";

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "RETRO_HIGH_SCORE", gameId: "road-fighter-1984", score: Math.floor(score) }, "*");
      }
    }

    function initTrees() {
      trees = [];
      for (let i = 0; i < 10; i++) {
        trees.push({ x: 20, y: i * 55 });
        trees.push({ x: 395, y: i * 55 + 25 });
      }
    }

    function startGame() {
      score = 0;
      fuel = 100;
      speed = 180;
      player.x = 205;
      player.spinTimer = 0;
      enemies = [];
      pickups = [];
      oils = [];
      initTrees();
      reportScore();
      isGameOver = false;
      document.getElementById("overlay").classList.add("hidden");
      sfx(240, 120);
      requestAnimationFrame(loop);
    }

    function spawnTraffic() {
      const lanes = [98, 148, 198, 248, 298];
      const laneX = lanes[(Math.random() * lanes.length) | 0];
      const r = Math.random();

      if (r < 0.16) {
        // FUEL Bonus Aracı
        pickups.push({ x: laneX, y: -60, w: 30, h: 50, speed: 120 });
      } else if (r < 0.27) {
        // Yağ Birikintisi
        oils.push({ x: laneX, y: -40, w: 32, h: 24 });
      } else {
        // Rakip Araçlar (Sarı: düz, Mavi: şerit değiştiren, Kamyon: büyük)
        const isTruck = Math.random() < 0.22;
        const isShifter = !isTruck && Math.random() < 0.35;
        enemies.push({
          x: laneX,
          y: -80,
          w: isTruck ? 36 : 30,
          h: isTruck ? 74 : 52,
          color: isTruck ? "#cccccc" : isShifter ? "#3399ff" : "#ffcc00",
          isTruck,
          isShifter,
          vx: isShifter ? (Math.random() < 0.5 ? 1.4 : -1.4) : 0,
          speed: isTruck ? 110 : 145
        });
      }
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function update() {
      const turbo = keys["ArrowUp"] || keys["KeyW"] || keys["Space"];
      const braking = keys["ArrowDown"] || keys["KeyS"];

      if (player.spinTimer > 0) {
        player.spinTimer--;
        player.x += Math.sin(player.spinTimer * 0.8) * 5;
        speed = Math.max(90, speed - 3);
      } else {
        const targetSpeed = turbo ? maxSpeed : braking ? 120 : 220;
        speed += (targetSpeed - speed) * 0.06;

        const steerSpeed = 4.8;
        if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= steerSpeed;
        if (keys["ArrowRight"] || keys["KeyD"]) player.x += steerSpeed;
      }

      // Bariyer çarpışması
      if (player.x < ROAD_LEFT + 6) {
        player.x = ROAD_LEFT + 12;
        player.spinTimer = 18;
        fuel -= 4;
        sfx(110, 140);
      } else if (player.x + player.w > ROAD_RIGHT - 6) {
        player.x = ROAD_RIGHT - player.w - 12;
        player.spinTimer = 18;
        fuel -= 4;
        sfx(110, 140);
      }

      const pixelSpeed = speed / 26;
      roadOffset = (roadOffset + pixelSpeed) % 48;
      score += pixelSpeed * 0.65;

      fuelTick++;
      if (fuelTick % 16 === 0) {
        fuel -= 0.7;
        reportScore();
      }

      if (fuel <= 0) {
        fuel = 0;
        endGame("BENZİN BİTTİ!");
        return;
      }

      // Ağaçları kaydır
      trees.forEach(t => {
        t.y += pixelSpeed;
        if (t.y > canvas.height) t.y = -30;
      });

      spawnTimer++;
      if (spawnTimer > Math.max(22, 48 - Math.floor(speed / 12))) {
        spawnTimer = 0;
        spawnTraffic();
      }

      // Yağ birikintileri
      for (let i = oils.length - 1; i >= 0; i--) {
        const o = oils[i];
        o.y += pixelSpeed;
        if (rectsOverlap(player, o)) {
          player.spinTimer = 22;
          sfx(180, 120, "triangle");
          oils.splice(i, 1);
          continue;
        }
        if (o.y > canvas.height + 40) oils.splice(i, 1);
      }

      // Yakıt (FUEL) araçları
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += pixelSpeed - p.speed / 35;
        if (rectsOverlap(player, p)) {
          fuel = Math.min(100, fuel + 22);
          score += 300;
          sfx(880, 90, "square");
          setTimeout(() => sfx(1174, 120, "square"), 70);
          pickups.splice(i, 1);
          reportScore();
          continue;
        }
        if (p.y > canvas.height + 60) pickups.splice(i, 1);
      }

      // Rakip araçlar
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += pixelSpeed - e.speed / 32;
        if (e.isShifter) {
          e.x += e.vx;
          if (e.x <= ROAD_LEFT + 10 || e.x + e.w >= ROAD_RIGHT - 10) e.vx = -e.vx;
        }

        if (rectsOverlap(player, e)) {
          sfx(95, 250, "sawtooth", 0.06);
          if (e.isTruck) {
            fuel -= 18;
            player.spinTimer = 28;
          } else {
            fuel -= 9;
            player.spinTimer = 18;
          }
          enemies.splice(i, 1);
          reportScore();
          if (fuel <= 0) {
            endGame("AĞIR HASAR & BENZİN BİTTİ!");
            return;
          }
          continue;
        }

        if (e.y > canvas.height + 80) {
          enemies.splice(i, 1);
          score += 50;
          reportScore();
        }
      }
    }

    function endGame(reason) {
      isGameOver = true;
      reportScore();
      document.getElementById("ov-title").innerText = reason;
      document.getElementById("ov-desc").innerText = `Toplam Mesafe Skoru: ${Math.floor(score)}`;
      document.getElementById("start-btn").innerText = "TEKRAR YARIŞ [ENTER]";
      document.getElementById("overlay").classList.remove("hidden");
    }

    function drawCar(x, y, w, h, bodyColor, label = "") {
      // Tekerlekler
      ctx.fillStyle = "#111";
      ctx.fillRect(x - 3, y + 6, 4, 11);
      ctx.fillRect(x + w - 1, y + 6, 4, 11);
      ctx.fillRect(x - 3, y + h - 17, 4, 11);
      ctx.fillRect(x + w - 1, y + h - 17, 4, 11);

      // Gövde
      ctx.fillStyle = bodyColor;
      ctx.fillRect(x, y, w, h);

      // Ön/Arka cam
      ctx.fillStyle = "#112233";
      ctx.fillRect(x + 4, y + 10, w - 8, 12);
      ctx.fillRect(x + 5, y + h - 16, w - 10, 8);

      // Farlar
      ctx.fillStyle = "#ffffaa";
      ctx.fillRect(x + 3, y, 6, 3);
      ctx.fillRect(x + w - 9, y, 6, 3);

      if (label) {
        ctx.fillStyle = "#ffffff";
        ctx.font = 'bold 10px "Courier New"';
        ctx.textAlign = "center";
        ctx.fillText(label, x + w / 2, y + h / 2 + 4);
      }
    }

    function draw() {
      // Çimen kenarlar
      ctx.fillStyle = "#1b5e20";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ağaçlar
      trees.forEach(t => {
        ctx.fillStyle = "#0d3b10";
        ctx.beginPath();
        ctx.arc(t.x + 12, t.y + 12, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2e7d32";
        ctx.beginPath();
        ctx.arc(t.x + 10, t.y + 10, 10, 0, Math.PI * 2);
        ctx.fill();
      });

      // Asfalt yol
      ctx.fillStyle = "#373b44";
      ctx.fillRect(ROAD_LEFT, 0, ROAD_W, canvas.height);

      // Kırmızı-Beyaz Bordürler
      for (let y = -48; y < canvas.height + 48; y += 24) {
        const yy = y + (roadOffset % 48);
        const isRed = Math.floor((y + 48) / 24) % 2 === 0;
        ctx.fillStyle = isRed ? "#e53935" : "#ffffff";
        ctx.fillRect(ROAD_LEFT - 10, yy, 10, 24);
        ctx.fillRect(ROAD_RIGHT, yy, 10, 24);
      }

      // Şerit Çizgileri
      ctx.fillStyle = "#ffffff";
      for (let lane = 1; lane <= 3; lane++) {
        const lx = ROAD_LEFT + (ROAD_W / 4) * lane;
        for (let y = -48; y < canvas.height + 48; y += 48) {
          ctx.fillRect(lx - 2, y + roadOffset, 4, 24);
        }
      }

      // Yağ Birikintileri
      oils.forEach(o => {
        ctx.fillStyle = "#111111";
        ctx.beginPath();
        ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Yakıt (FUEL) Araçları
      pickups.forEach(p => {
        drawCar(p.x, p.y, p.w, p.h, "#ff00aa", "FUEL");
      });

      // Rakip Araçlar
      enemies.forEach(e => {
        drawCar(e.x, e.y, e.w, e.h, e.color, e.isTruck ? "TIR" : "");
      });

      // Oyuncu Kırmızı Spor Araba
      ctx.save();
      if (player.spinTimer > 0) {
        ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
        ctx.rotate(Math.sin(player.spinTimer) * 0.35);
        drawCar(-player.w / 2, -player.h / 2, player.w, player.h, "#ff1744");
      } else {
        drawCar(player.x, player.y, player.w, player.h, "#ff1744");
      }
      ctx.restore();
    }

    function loop() {
      if (isGameOver) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", e => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
      if (e.key === "Enter" && isGameOver) startGame();
    });

    document.addEventListener("keyup", e => {
      keys[e.code] = false;
    });

    document.getElementById("start-btn").addEventListener("click", startGame);

    document.getElementById("sound-btn").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-btn").innerText = soundEnabled ? "SES: AÇIK" : "SES: KAPALI";
    });

    initTrees();
    draw();
  </script>
</body>
</html>
